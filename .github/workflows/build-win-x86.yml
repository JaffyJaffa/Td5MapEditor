name: build-win-x86

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW32)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-make
            unzip
            zip
            git
            python
            curl
            perl

      - name: Download wxWidgets 2.8.12 sources
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p deps
          cd deps
          curl -L -o wxWidgets-2.8.12.zip "https://downloads.sourceforge.net/project/wxwindows/2.8.12/wxWidgets-2.8.12.zip"
          unzip -q wxWidgets-2.8.12.zip

      - name: Create wx-compat.h
      
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p deps
          cat > deps/wx-compat.h <<'EOF'
           #pragma once
           #include <windows.h>
           #include <commctrl.h>

           #ifndef NMTVITEMCHANGE
               typedef struct tagNMTVITEMCHANGE {
             NMHDR     hdr;
             UINT      uChanged;
             HTREEITEM hItem;
             LPARAM    lParam;
             UINT      uStateNew;
             UINT      uStateOld;
           } NMTVITEMCHANGE, *LPNMTVITEMCHANGE;
          #endif
          EOF
     
          
      - name: Patch wxWidgets 2.8.12 for modern MinGW
        shell: msys2 {0}
        run: |
          set -euo pipefail
          WXWIN="$PWD/deps/wxWidgets-2.8.12"
          f="$WXWIN/src/msw/utilsexc.cpp"

          # Исправление ошибки сужения (narrowing error) для современных компиляторов
          sed -i 's/^[[:space:]]*case[[:space:]]\+-1[[:space:]]*:/            case 0xFFFFFFFF:/' "$f"


      - name: Patch wxWidgets 2.8.12 (tif_win32.c force ANSI)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          f="deps/wxWidgets-2.8.12/src/tiff/tif_win32.c"

          # 1) Вставляем ANSI-изоляцию в начало файла (после первых include/комментариев не важно — главное до windows.h использования)
          # Вставим самым верхом.
            perl -0777 -i -pe '
          if ($_ !~ /WX_TIFF_WIN32_FORCE_ANSI/s) {
          $_ = "/* WX_TIFF_WIN32_FORCE_ANSI */\n".
             "#ifdef UNICODE\n#undef UNICODE\n#endif\n".
             "#ifdef _UNICODE\n#undef _UNICODE\n#endif\n".
             "#define WIN32_LEAN_AND_MEAN\n".
             "/* end WX_TIFF_WIN32_FORCE_ANSI */\n\n" . $_;
          }
          ' "$f"

          # 2) Приводим типы/функции к ANSI-версии
          perl -0777 -i -pe '
          s/\bLPCTSTR\b/const char*/g;
          s/\bLPTSTR\b/char*/g;
          s/\bTCHAR\b/char/g;

          s/\bwsprintf\(/wsprintfA(/g;
          s/\blstrlen\(/lstrlenA(/g;
          s/\bwvsprintf\(/wvsprintfA(/g;

          s/\bMessageBox\(/MessageBoxA(/g;
          s/\bFormatMessage\(/FormatMessageA(/g;
          s/\bGetModuleHandle\(/GetModuleHandleA(/g;
          s/\bGetModuleFileName\(/GetModuleFileNameA(/g;
          ' "$f"

          
      - name: Patch wxWidgets 2.8.12 (tif_win32.c: force WinAPI A)
        shell: msys2 {0}
        run: |    
           set -euo pipefail
           f="deps/wxWidgets-2.8.12/src/tiff/tif_win32.c"

           perl -0777 -i -pe '
                 s/\bCreateFile\s*\(/CreateFileA(/g;
            s/\bGetFileAttributes\s*\(/GetFileAttributesA(/g;
            s/\bSetFileAttributes\s*\(/SetFileAttributesA(/g;
            s/\bDeleteFile\s*\(/DeleteFileA(/g;
            s/\bMoveFile\s*\(/MoveFileA(/g;
            s/\bCopyFile\s*\(/CopyFileA(/g;

            s/\bFormatMessage\s*\(/FormatMessageA(/g;
            s/\bGetModuleFileName\s*\(/GetModuleFileNameA(/g;
            s/\bGetModuleHandle\s*\(/GetModuleHandleA(/g;

            s/\bMessageBox\s*\(/MessageBoxA(/g;
            s/\bwsprintf\s*\(/wsprintfA(/g;
            s/\bwvsprintf\s*\(/wvsprintfA(/g;
            s/\blstrlen\s*\(/lstrlenA(/g;
             ' "$f"
          
      - name: Build wxWidgets 2.8.12 (static unicode release)
        shell: msys2 {0}
        run: |
            set -euo pipefail
            WXWIN="$PWD/deps/wxWidgets-2.8.12"
             cd "$WXWIN/build/msw"

            mingw32-make -j1 -f makefile.gcc BUILD=release SHARED=0 UNICODE=1 MONOLITHIC=0 \
            CPPFLAGS="-DUNICODE -D_UNICODE -D_WIN32_WINNT=0x0501 -D_WIN32_IE=0x0600 -include \"$GITHUB_WORKSPACE/deps/wx-compat.h\""

            test -f "$WXWIN/lib/gcc_lib/mswu/wx/setup.h"
            echo "WXWIN=$WXWIN" >> "$GITHUB_ENV"

      - name: Build Td5MapEditor (auto-find.cbp)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.getcwd())
          cbps = list(root.rglob("*.cbp"))
          if not cbps:
              raise SystemExit("No .cbp found")
          cbp = next((p for p in cbps if p.name.lower() == "td5mapeditor.cbp"), cbps[0])
          print(f"Using: {cbp}")

          wxwin = Path(os.environ["WXWIN"])
          wx_cfg_inc = wxwin / "lib" / "gcc_lib" / "mswu"
          wx_inc = wxwin / "include"
          wx_lib = wxwin / "lib" / "gcc_lib"

          tree = ET.parse(cbp)
          proj = tree.getroot()

          def strip(tag: str) -> str:
              return tag.split("}", 1)[-1]

          targets = [t for t in proj.iter() if strip(t.tag) == "Target"]
          target = next((t for t in targets if t.attrib.get("title","").lower()=="release"), targets[0])

          sources = []
          for u in proj.iter():
              if strip(u.tag) == "Unit":
                  fn = u.attrib.get("filename","")
                  if fn.lower().endswith((".cpp",".c",".cc",".cxx")):
                      sources.append((root / fn).resolve())

          include_dirs = set()
          lib_dirs = set()
          libs = []

          for comp in target.iter():
              if strip(comp.tag) == "Compiler":
                  for a in comp:
                      if strip(a.tag) == "Add" and "directory" in a.attrib:
                          include_dirs.add(a.attrib["directory"])
              if strip(comp.tag) == "Linker":
                  for a in comp:
                      if strip(a.tag) == "Add":
                          if "directory" in a.attrib:
                              lib_dirs.add(a.attrib["directory"])
                          if "library" in a.attrib:
                              libs.append(a.attrib["library"])

          include_dirs.update([str(wx_inc), str(wx_cfg_inc)])
          lib_dirs.add(str(wx_lib))

          bdir = (root / "build-win-x86").resolve()
          bdir.mkdir(exist_ok=True)

          cxx = "g++"
          # Добавлен флаг -D_WIN32_WINNT=0x0501 для совместимости с wxWidgets
          cxxflags = ["-O2", "-pipe", "-D__WXMSW__", "-DwxUSE_UNICODE=1", "-D_WIN32_WINNT=0x0501", "-static-libgcc", "-static-libstdc++"]
          incflags = [f"-I{d}" for d in include_dirs if d]

          objects = []
          for src in sources:
              obj = bdir / (src.stem + ".o")
              print(f"Compiling: {src.name}")
              subprocess.check_call([cxx, "-c", str(src), "-o", str(obj), *cxxflags, *incflags])
              objects.append(str(obj))

          syslibs = ["comctl32","comdlg32","gdi32","winspool","winmm","shell32","shlwapi","ole32","oleaut32","uuid","rpcrt4","advapi32","ws2_32"]

          libflags = []
          if not any("wx" in l.lower() for l in libs):
              libflags += ["-lwxmsw28u_core","-lwxbase28u","-lwxmsw28u_adv"]
          for l in libs:
              l = l.strip()
              if l:
                  libflags.append(l if l.startswith("-l") else f"-l{l}")
          libflags += [f"-l{s}" for s in syslibs]

          libdirflags = [f"-L{d}" for d in lib_dirs if d]
          ldflags = ["-Wl,--subsystem,windows","-static-libgcc","-static-libstdc++"]

          out_exe = bdir / "Td5MapEditor.exe"
          subprocess.check_call([cxx, "-o", str(out_exe), *objects, *libdirflags, *libflags, *ldflags])
          print(f"Built successfully: {out_exe}")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Td5MapEditor-win-x86
          path: build-win-x86/Td5MapEditor.exe
