name: build-win-x86

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW32)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-make
            mingw-w64-i686-cmake
            unzip
            zip
            git
            python
            curl

      - name: Download wxWidgets 2.8.12 sources
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          mkdir -p deps
          cd deps
          curl -L -o wxWidgets-2.8.12.zip "https://downloads.sourceforge.net/project/wxwindows/2.8.12/wxWidgets-2.8.12.zip"
          unzip -q wxWidgets-2.8.12.zip
          ls -la

      - name: Build wxWidgets (static, UNICODE, release, MINGW32)
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          WXWIN="$PWD/deps/wxWidgets-2.8.12"

          # makefile.gcc генерит/копирует setup.h в lib/gcc_lib/mswu/wx и падает,
          # если папки нет.
          mkdir -p "$WXWIN/lib/gcc_lib/mswu/wx"

          cd "$WXWIN/build/msw"

          # wx 2.8 + современный GCC: отключаем narrowing и прочую "строгость"
          mingw32-make -j1 -f makefile.gcc BUILD=release SHARED=0 UNICODE=1 MONOLITHIC=0 \
            CFLAGS="-O2 -pipe -Wno-error" \
            CXXFLAGS="-O2 -pipe -Wno-error -Wno-narrowing -fpermissive"

          # Проверка, что setup.h появился
          test -f "$WXWIN/lib/gcc_lib/mswu/wx/setup.h"
          ls -la "$WXWIN/lib/gcc_lib/mswu/wx/"

          echo "WXWIN=$WXWIN" >> "$GITHUB_ENV"

      - name: Build Td5MapEditor from Code::Blocks .cbp (custom parser)
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          python - << 'PY'
          import os, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.getcwd())
          cbp = root / "td5mapeditor.cbp"
          if not cbp.exists():
            raise SystemExit(f"CBP not found: {cbp}")

          wxwin = Path(os.environ["WXWIN"])
          wx_cfg_inc = wxwin / "lib" / "gcc_lib" / "mswu"
          wx_inc = wxwin / "include"
          wx_lib = wxwin / "lib" / "gcc_lib"

          tree = ET.parse(cbp)
          proj = tree.getroot()

          def strip(tag: str) -> str:
            return tag.split("}", 1)[-1]

          targets = [t for t in proj.iter() if strip(t.tag) == "Target"]
          if not targets:
            raise SystemExit("No <Target> found in .cbp")

          target = None
          for t in targets:
            title = t.attrib.get("title", "")
            if title.lower() == "release":
              target = t
              break
          if target is None:
            target = targets[0]

          # Source files from Units
          sources = []
          for u in proj.iter():
            if strip(u.tag) == "Unit":
              fn = u.attrib.get("filename", "")
              if fn.lower().endswith((".cpp", ".c", ".cc", ".cxx")):
                sources.append(root / fn)
