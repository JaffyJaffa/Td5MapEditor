name: build-win-x86-ansi

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MINGW32)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-toolchain
            mingw-w64-i686-make
            unzip
            zip
            git
            python
            curl
            perl

      - name: Download wxWidgets 2.8.12
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p deps
          cd deps
          curl -L -o wxWidgets-2.8.12.zip "https://downloads.sourceforge.net/project/wxwindows/2.8.12/wxWidgets-2.8.12.zip"
          unzip -q wxWidgets-2.8.12.zip

      - name: Patch narrowing error (utilsexc.cpp)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          f="deps/wxWidgets-2.8.12/src/msw/utilsexc.cpp"
          sed -i 's/case -1:/case 0xFFFFFFFF:/' "$f"

      - name: Build wxWidgets ANSI
        shell: msys2 {0}
        run: |
          set -euo pipefail
          WXWIN="$PWD/deps/wxWidgets-2.8.12"
          mkdir -p "$WXWIN/lib/gcc_lib/msw"
          cd "$WXWIN/build/msw"

          mingw32-make -j2 -f makefile.gcc \
            BUILD=release \
            SHARED=0 \
            UNICODE=0 \
            MONOLITHIC=0 \
            CPPFLAGS="-D_WIN32_WINNT=0x0501 -D_WIN32_IE=0x0600"

          echo "WXWIN=$WXWIN" >> "$GITHUB_ENV"

      - name: Build Td5MapEditor
        shell: msys2 {0}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.getcwd())
          cbp = next(root.rglob("*.cbp"))
          print("Using project:", cbp)

          wxwin = Path(os.environ["WXWIN"])
          wx_inc = wxwin / "include"
          wx_cfg_inc = wxwin / "lib" / "gcc_lib" / "msw"
          wx_lib = wxwin / "lib" / "gcc_lib"

          tree = ET.parse(cbp)
          proj = tree.getroot()

          def strip(tag):
              return tag.split("}",1)[-1]

          sources=[]
          for u in proj.iter():
              if strip(u.tag)=="Unit":
                  fn=u.attrib.get("filename","")
                  if fn.lower().endswith((".cpp",".c")):
                      sources.append((root/fn).resolve())

          builddir=root/"build"
          builddir.mkdir(exist_ok=True)

          cxx="g++"
          flags=[
              "-O2",
              "-pipe",
              "-D__WXMSW__",
              "-D_WIN32_WINNT=0x0501",
              "-static-libgcc",
              "-static-libstdc++"
          ]

          incflags=[f"-I{wx_inc}", f"-I{wx_cfg_inc}"]

          objects=[]
          for src in sources:
              obj=builddir/(src.stem+".o")
              subprocess.check_call([cxx,"-c",str(src),"-o",str(obj),*flags,*incflags])
              objects.append(str(obj))

          libs=[
              "-lwxmsw28_core",
              "-lwxbase28",
              "-lwxmsw28_adv",
              "-lcomctl32","-lcomdlg32","-lgdi32","-lwinspool",
              "-lwinmm","-lshell32","-lole32","-loleaut32",
              "-luuid","-ladvapi32","-lws2_32"
          ]

          exe=builddir/"Td5MapEditor.exe"
          subprocess.check_call([
              cxx,"-o",str(exe),
              *objects,
              f"-L{wx_lib}",
              *libs,
              "-Wl,--subsystem,windows"
          ])

          print("Built:",exe)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Td5MapEditor-winXP-ansi
          path: build/Td5MapEditor.exe
